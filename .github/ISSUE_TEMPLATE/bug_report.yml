name: Bug melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Fedora-Version
      placeholder: z.B. 0.1.0 auf Fedora 44
