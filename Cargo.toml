[package]
name = "fancy-renamer"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Datei-Umbenennungstool mit grafischer Oberfläche für Fedora Linux"
repository = "https://github.com/TheRealKoller/fancy-renamer"

[lib]
name = "fancy_renamer"
path = "src/lib.rs"

[[bin]]
name = "fancy-renamer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glib = { version = "0.22", features = ["v2_72"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
kamadak-exif = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
